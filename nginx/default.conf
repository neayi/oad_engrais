# Cache long pour les polices (noms stables), revalidation pour le reste.
map $uri $cache_control {
  ~^/assets/fonts/  "public, max-age=31536000, immutable";
  default           "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;

  add_header Cache-Control $cache_control always;
  # Pour une intégration en iframe, ajouter le domaine hôte à frame-ancestors.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /_headers { return 404; }
  location / { try_files $uri $uri/ =404; }
}
